<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Posada</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Saira+Condensed:wght@700&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pino:#0c3b29; --pino2:#0f4d32; --hoja:#2f9e62; --hoja2:#1f7a4d;
  --rojo:#c8102e; --rojo2:#9a0b22; --oro:#f2c14e; --nieve:#fffaf3; --tinta:#2a1d1f; --suave:#6e5f61;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Nunito,system-ui,sans-serif;color:var(--nieve);padding-bottom:40px;overflow-x:hidden;
  background:radial-gradient(ellipse 120% 60% at 50% 0%,#1a6b47 0%,var(--pino2) 45%,var(--pino) 100%) no-repeat,var(--pino);
}
html{background:var(--pino)}

/* Nieve */
#nieve{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.copo{position:absolute;top:-12px;color:#fff;opacity:.85;animation:nevar linear infinite}
@keyframes nevar{to{transform:translate(var(--dx),105vh) rotate(360deg)}}

/* Esferas colgantes */
.esferas{display:block;width:100%;max-width:480px;height:auto;margin:0 auto;position:relative;z-index:2}
.esfera{transform-box:view-box;animation:columpio 3.6s ease-in-out infinite}
@keyframes columpio{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

.hoja{max-width:440px;margin:0 auto;padding:0 18px;position:relative;z-index:2}

/* Escena */
.escena{display:block;width:100%;height:auto;margin:-18px 0 0}
.arbol{transform-box:view-box;transform-origin:180px 216px;animation:crecer 1.1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes crecer{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
.estrella{transform-box:view-box;transform-origin:180px 46px;
  animation:aparece .5s 1s cubic-bezier(.2,1.6,.4,1) both,brilla 1.8s 1.5s ease-in-out infinite}
@keyframes aparece{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes brilla{0%,100%{transform:scale(1);filter:drop-shadow(0 0 3px #f2c14e)}50%{transform:scale(1.15);filter:drop-shadow(0 0 10px #ffe08a)}}
.luz{animation:parpadeo 1.2s ease-in-out infinite}
@keyframes parpadeo{0%,100%{opacity:1}50%{opacity:.25}}
.santa{animation:llega-der .9s .5s cubic-bezier(.2,1.2,.4,1) both}
.santa-cuerpo{animation:rebote 1.6s 1.4s ease-in-out infinite}
@keyframes llega-der{from{transform:translateX(140px);opacity:0}to{transform:none;opacity:1}}
@keyframes rebote{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mano{transform-box:view-box;transform-origin:309px 160px;animation:saludo .7s 1.4s ease-in-out infinite alternate}
@keyframes saludo{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.reno{animation:llega-izq .9s .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes llega-izq{from{transform:translateX(-140px);opacity:0}to{transform:none;opacity:1}}
.cabeza{transform-box:view-box;transform-origin:96px 176px;animation:asiente 2.4s 1.6s ease-in-out infinite}
@keyframes asiente{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}}

.mono{transform-box:view-box;transform-origin:180px 222px;animation:crecer .8s cubic-bezier(.2,1.3,.4,1) both}
.mono-cabeza{transform-box:view-box;transform-origin:180px 98px;animation:niega .9s .8s ease-in-out infinite}
@keyframes niega{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.globo{transform-box:view-box;transform-origin:240px 86px;animation:aparece .45s .9s cubic-bezier(.2,1.6,.4,1) both}
.mono-regalos{animation:llega-izq .8s .3s cubic-bezier(.2,1.2,.4,1) both}

.nino-salta{transform-box:fill-box;transform-origin:50% 100%;animation:saltar .9s ease-in-out infinite}
@keyframes saltar{0%,100%{transform:translateY(0) scaleY(.92)}12%{transform:translateY(0) scaleY(1)}
  50%{transform:translateY(-36px) scaleY(1.04)}88%{transform:translateY(0) scaleY(1)}}
.nino-sombra{transform-box:fill-box;transform-origin:50% 50%;animation:sombra .9s ease-in-out infinite}
@keyframes sombra{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.5);opacity:.35}}
.nino-brazo{transform-box:fill-box;animation:agita .45s ease-in-out infinite alternate}
.nino-brazo.izq{transform-origin:100% 100%}.nino-brazo.der{transform-origin:0% 100%}
@keyframes agita{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}

.estrella-chica{transform-box:fill-box;transform-origin:50% 50%;animation:brilla 1.8s ease-in-out infinite}

/* Fondo blanco al ganar puntos */
html,body{transition:background-color .4s}
html.blanca,body.blanca{background:#fff}
body.blanca .hero h1{color:var(--rojo);text-shadow:0 3px 0 #f2c14e}
body.blanca .copo{color:#a9c6dc}
body.blanca .nota{color:var(--suave)}

.santa-lee{animation:rebote 2s ease-in-out infinite}
.carta{transform-box:fill-box;transform-origin:20% 80%;animation:lee 2.4s ease-in-out infinite}
@keyframes lee{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.escaner{animation:escanea 1.3s ease-in-out infinite alternate}
@keyframes escanea{from{transform:translateY(0)}to{transform:translateY(32px)}}
.duende{animation:rebote 1.2s ease-in-out infinite}
.duende-cabeza{transform-box:fill-box;transform-origin:50% 100%;animation:asiente 2s ease-in-out infinite}
.duende-brazo{transform-box:fill-box;transform-origin:0% 10%;animation:lee 2s ease-in-out infinite}
.revisando{text-align:center;padding:10px 0 30px}
.revisando .t{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.35;color:#fff;
  letter-spacing:.2px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.revisando .puntitos{display:inline-flex;gap:6px;margin-top:12px}
.revisando .puntitos i{width:10px;height:10px;border-radius:50%;background:var(--oro);animation:pulso 1s ease-in-out infinite}
.revisando .puntitos i:nth-child(2){background:#fff;animation-delay:.15s}
.revisando .puntitos i:nth-child(3){background:var(--rojo);animation-delay:.3s}
@keyframes pulso{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}

.hero{text-align:center;margin:0 0 20px}
.separador{height:24px}
.hero .lugar{font-family:"Mountains of Christmas",cursive;color:var(--oro);font-size:30px;margin:0;line-height:1}
.hero h1{font-family:"Mountains of Christmas",cursive;font-weight:700;font-size:clamp(36px,11vw,52px);line-height:1;
  margin:4px 0 0;text-shadow:0 3px 0 var(--rojo2);text-wrap:balance}

/* Tarjetas */
.tarjeta{position:relative;background:var(--nieve);color:var(--tinta);border-radius:22px;padding:30px 22px 24px;
  overflow:hidden;box-shadow:0 22px 40px -18px rgba(0,0,0,.6)}
.tarjeta::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;
  background:repeating-linear-gradient(-45deg,var(--rojo) 0 12px,#fff 12px 24px)}
.tarjeta h2{font-family:"Mountains of Christmas",cursive;font-size:34px;line-height:1.05;margin:0 0 8px;color:var(--rojo)}
.tarjeta p{margin:0;line-height:1.5;color:var(--suave);font-size:16px}

label.campo{display:block;margin-top:20px;font-weight:800;font-size:15px}
#n{display:block;width:100%;margin-top:8px;font:600 20px Nunito,sans-serif;padding:14px 16px;border-radius:14px;
  border:2px solid #e9dcd2;background:#fff;color:var(--tinta);outline:none;transition:border-color .15s}
#n:focus{border-color:var(--hoja2)}
.boton{display:block;width:100%;margin-top:16px;border:0;border-radius:999px;padding:16px 20px;cursor:pointer;
  font:900 19px Nunito,sans-serif;color:#fff;background:var(--rojo);box-shadow:0 6px 0 var(--rojo2);
  transition:transform .08s,box-shadow .08s}
.boton:active{transform:translateY(4px);box-shadow:0 2px 0 var(--rojo2)}
.boton:focus-visible,#n:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.boton[disabled]{opacity:.6}
.extra{margin-top:12px !important;font-size:14px !important;text-align:center}
.ayuda{margin-top:8px !important;font-size:14px !important}
.ayuda.error{color:var(--rojo) !important;font-weight:800}
.boton.secundario{background:#fff;color:var(--rojo);border:2px solid var(--rojo);box-shadow:0 4px 0 #e9dcd2}
.id-jugador{text-align:center;margin-top:12px !important;font-size:14px !important}
.id-jugador b{color:var(--tinta)}

.pasos{list-style:none;padding:0;margin:24px 4px 0;counter-reset:p}
.pasos li{counter-increment:p;display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;line-height:1.45;color:#e3f1e8}
.pasos li::before{content:counter(p);flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font:900 15px Nunito,sans-serif;color:#fff;background:var(--rojo);border:2px solid var(--oro)}
.pasos b{color:#fff}

/* Resultado del escaneo */
.estado{display:flex;gap:14px;align-items:center;border-radius:20px;padding:16px 18px;margin-bottom:16px;
  background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);animation:entra .55s cubic-bezier(.2,1.4,.4,1) both}
.estado .ico{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.15)}
.estado .t{font-family:"Mountains of Christmas",cursive;font-size:30px;line-height:1.05;color:#fff;font-weight:700;
  text-shadow:0 2px 0 var(--rojo2),0 0 12px rgba(255,255,255,.35)}
.estado .s{color:#e3f1e8;font-size:15px;margin-top:4px;line-height:1.35}
.estado.ok{position:relative;background:#fffaf0;border:9px solid transparent;border-radius:6px;
  border-image:repeating-linear-gradient(-45deg,var(--rojo) 0 10px,#fff 10px 20px,var(--hoja2) 20px 30px,#fff 30px 40px) 9;
  box-shadow:0 18px 30px -14px rgba(0,0,0,.6);padding:22px 56px 20px 18px}
.estado.ok .t{color:var(--rojo);text-shadow:none}
.estado.ok .s{color:var(--hoja2);font-weight:800}
.estado.ok .ico{background:#fff3d6;border:2px dashed #e3c98f}
.estado.ok .timbre{position:absolute;top:-18px;right:-14px;width:44px;height:52px;background:#fff;transform:rotate(8deg);
  display:grid;place-items:center;font-size:24px;border:2px dashed var(--rojo);border-radius:3px;
  box-shadow:0 3px 6px rgba(0,0,0,.18)}
.estado.repetido{background:#f7ecd8;border-color:#e3c98f}
.estado.repetido .t{color:var(--rojo);text-shadow:none}
.estado.repetido .s{color:var(--rojo2);font-weight:700}
.estado.repetido .ico{background:#fff;border:2px solid #f1d9d9}
.estado .ico svg{width:42px;height:42px}
.estado.expirado,.estado.agotado{background:rgba(0,0,0,.25);border-color:#ffffff55}
.estado.grande{padding:22px 20px;margin:6px 0 16px}
.estado.grande .t{font-size:34px}
.aviso{display:table;margin:0 auto 14px;padding:8px 16px;border-radius:999px;font-weight:800;font-size:15px;
  background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.25);color:#fff;animation:entra .45s both}
.aviso.ok{background:var(--rojo);border-color:var(--oro)}
@keyframes entra{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.quien{display:flex;align-items:center;gap:14px}
.avatar{position:relative;flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:var(--hoja2);color:#fff;font:900 22px Nunito,sans-serif;margin-top:8px}
.avatar svg{position:absolute;top:-20px;left:4px;width:58px;transform:rotate(-12deg)}
.hola{color:var(--suave);font-size:15px}
.nombre{font-weight:900;font-size:24px;line-height:1.15;word-break:break-word}
.puntos{text-align:center;margin-top:22px;padding-top:18px;border-top:2px dashed #ecdcd3}
.puntos .num{display:block;font:900 72px/1 Nunito,sans-serif;color:var(--rojo);font-variant-numeric:tabular-nums}
.puntos .unidad{display:block;margin-top:4px;font-family:"Mountains of Christmas",cursive;font-size:26px;color:var(--hoja2)}

.nota{text-align:center;margin:22px 8px 0;color:#e3f1e8;line-height:1.5;font-size:16px}
.cargando{text-align:center;padding:40px 0;color:#e3f1e8;font-size:18px}

.conf{position:fixed;top:-20px;z-index:9;pointer-events:none;animation:caer linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important}
  #nieve,.conf{display:none}
}
</style>
</head>

</svg>

<main class="hoja">
  <svg class="escena" id="escena-normal" viewBox="-92 0 452 238" role="img" aria-label="Santa Claus saludando junto a un pino navideño y un reno">
    <!-- Suelo nevado -->

      <rect x="216" y="196" width="6" height="26" fill="#c8102e"/><rect x="204" y="206" width="30" height="5" fill="#c8102e"/>
    </g>

    <!-- Santa -->
    <g class="santa"><g class="santa-cuerpo">
      <rect x="268" y="204" width="14" height="13" rx="4" fill="#222"/>
      <rect x="288" y="204" width="14" height="13" rx="4" fill="#222"/>
      <ellipse cx="259" cy="180" rx="8" ry="15" fill="#c8102e" transform="rotate(14 259 180)"/>
      <circle cx="255" cy="194" r="6.5" fill="#1f7a4d"/>
      <ellipse cx="285" cy="180" rx="28" ry="31" fill="#c8102e"/>

<script>
// ====== CONFIGURACIÓN ======
// Pega aquí la URL de tu Apps Script (la que termina en /exec)
var API = 'https://script.google.com/macros/s/AKfycbz3BdSkfxvH9OzpXBI4hdP0D5GQu6DWrOJOsajLLxBc3F9gvqqaVgL_Pq5Nra9zPg1s/exec';

var D = {
  codigo: (new URLSearchParams(location.search).get('codigo') || '').trim(),
  evento: '',
  mensajeFinal: 'No te pierdas nada.<br>¡Sigue participando en las demás actividades!'
};
var LLAVE = 'posada_jugador';
var COLORES = ['#c8102e', '#f2c14e', '#2f9e62', '#ffffff', '#1f7a4d', '#ff4d4d'];
var GORRO = '<svg viewBox="0 0 60 40" aria-hidden="true"><path d="M6 32 Q22 0 52 14 L42 32Z" fill="#c8102e"/>' +
  '<rect x="2" y="28" width="46" height="10" rx="5" fill="#fff"/><circle cx="53" cy="15" r="6" fill="#fff"/></svg>';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Clave única de este celular. Se guarda en dos lugares del navegador
// (memoria local y cookie) para que no se pierda entre escaneos.
function leerCookie() {
  var m = document.cookie.match(/(?:^|; )posada_jugador=([a-z0-9]+)/);
  return m ? m[1] : null;
}
function guardarClave(c) {
  try { localStorage.setItem(LLAVE, c); } catch (e) {}
  try { document.cookie = LLAVE + '=' + c + '; max-age=31536000; path=/; SameSite=None; Secure; Partitioned'; } catch (e) {}
}
function clave() {
  var c = null;
  try { c = localStorage.getItem(LLAVE); } catch (e) {}
  if (!c) c = leerCookie();
  if (!c) c = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  guardarClave(c);
  return c;
}

function poner(h) { document.getElementById('app').innerHTML = h; }
// Pantalla de espera mientras se valida el código: Santa lee la carta y el duende revisa la lista
function revisando(txt) {
  verEscena('leyendo');
  poner('<div class="revisando" role="status"><div class="t">' + esc(txt) + '…</div>' +
    '<div class="puntitos" aria-hidden="true"><i></i><i></i><i></i></div></div>');
}
function cargando(txt) { poner('<div class="cargando">' + (txt || 'Un momento…') + '</div>'); }

// Llama al Apps Script y recibe la respuesta en JSON
var PARAMS = { escanear: ['codigo', 'clave', 'nombre', 'opcion'], estado: ['clave'], registrar: ['clave', 'nombre'] };
function servidor(fn, args, ok) {
  var q = new URLSearchParams({ api: fn });
  PARAMS[fn].forEach(function (k, i) { q.set(k, args[i] == null ? '' : args[i]); });
  fetch(API + '?' + q.toString())
    .then(function (r) { return r.json(); })
    .then(function (o) {
      if (o && o.evento) ponerEvento(o.evento);
      if (o && o.mensajeFinal) D.mensajeFinal = o.mensajeFinal;
      ok(o);
    })
    .catch(function () {
      resultado({ tipo: 'error', titulo: 'Sin conexión', sub: 'Revisa tu internet y vuelve a escanear el código.' });
    });
}
function ponerEvento(t) {
  D.evento = t;
  document.getElementById('t2').textContent = t;
  ponerLetrero(t);
  try { localStorage.setItem('posada_evento', t); } catch (e) {}
  document.title = t;
}

/* ---------- Decoración ---------- */
function esferas() {
  var svg = document.getElementById('esferas'), h = '';
  var datos = [[24, 22, 13, '#c8102e'], [76, 40, 15, '#f2c14e'], [128, 18, 12, '#2f9e62'], [180, 46, 16, '#ffffff'],
               [232, 18, 12, '#c8102e'], [284, 38, 15, '#d9dde3'], [336, 22, 13, '#2f9e62']];
  datos.forEach(function (e, i) {
    var x = e[0], largo = e[1], r = e[2], c = e[3], cy = largo + 8 + r;
    h += '<g class="esfera" style="transform-origin:' + x + 'px 0px;animation-delay:-' + (i * 0.5) + 's">' +
      '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + (largo + 2) + '" stroke="#f2c14e" stroke-width="1.2"/>' +
      '<rect x="' + (x - 4) + '" y="' + largo + '" width="8" height="8" rx="1.5" fill="#d4a63a"/>' +
      '<circle cx="' + x + '" cy="' + cy + '" r="' + r + '" fill="' + c + '"/>' +
      '<path d="M' + (x - r) + ' ' + cy + ' Q' + x + ' ' + (cy + r * 0.45) + ' ' + (x + r) + ' ' + cy + '" stroke="' +
        (c === '#ffffff' ? '#c8102e' : '#ffffff') + '" stroke-opacity=".55" stroke-width="2" fill="none"/>' +
      '<ellipse cx="' + (x - r * 0.38) + '" cy="' + (cy - r * 0.4) + '" rx="' + (r * 0.28) + '" ry="' + (r * 0.18) +
        '" fill="#fff" opacity=".7" transform="rotate(-35 ' + (x - r * 0.38) + ' ' + (cy - r * 0.4) + ')"/>' +
      '</g>';
  });
  svg.innerHTML = h;
}

function nieve() {
  var cont = document.getElementById('nieve');
  for (var i = 0; i < 36; i++) {
    var c = document.createElement('div');
    c.className = 'copo';
    c.textContent = Math.random() < 0.35 ? '❄' : '•';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.fontSize = (8 + Math.random() * 14) + 'px';
    c.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    c.style.animationDuration = (7 + Math.random() * 8) + 's';
    c.style.animationDelay = -(Math.random() * 15) + 's';
    cont.appendChild(c);
  }
}

/* ---------- Pantallas ---------- */
function bienvenida(conQR, error) {
  verEscena('normal');
  poner(
    '<section class="tarjeta">' +
      '<h2>¡Bienvenido a la posada!</h2>' +
      '<p>Escanea todos los códigos QR que puedas. Cada uno te da puntos que puedes cambiar por premios.</p>' +
      '<label class="campo" for="n">Elige tu apodo</label>' +
      '<input id="n" maxlength="12" placeholder="Escribe tu apodo" autocomplete="off" autocapitalize="none" ' +

      '<p class="ayuda" id="ayuda">' + (error ? esc(error) : 'De 4 a 12 letras o números, sin espacios.') + '</p>' +
      '<button class="boton" id="btn">' + (conQR ? '🎁 Unirme y sumar puntos' : '🎁 Unirme al juego') + '</button>' +
      (conQR ? '<p class="extra">Al unirte se suman los puntos de este código.</p>' : '') +
      '<p class="extra">¿Ya tenías apodo? Escríbelo igual y recuperas tus puntos.</p>' +
    '</section>' +
    '<ol class="pasos">' +
      '<li><span><b>Encuentra un QR</b> y escanéalo con la cámara de tu celular.</span></li>' +
      '<li><span><b>Suma puntos.</b> Cada código cuenta una sola vez por persona.</span></li>' +
      '<li><span><b>Canjea tus puntos</b> por premios con los organizadores.</span></li>' +
    '</ol>' +
    '<p class="nota">Usa siempre este mismo celular y navegador para no perder tus puntos.</p>');

  var input = document.getElementById('n'), btn = document.getElementById('btn');
  var ayuda = document.getElementById('ayuda');
  if (error) ayuda.className = 'ayuda error';
  input.oninput = function () { input.value = input.value.replace(/[^A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ]/g, ''); };
  function enviarNombre() {
    var nombre = input.value.trim();
    if (!/^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ]{4,12}$/.test(nombre)) {
      ayuda.textContent = 'Usa de 4 a 12 letras o números, sin espacios ni símbolos.';
      ayuda.className = 'ayuda error';
      input.focus();
      return;
    }
    btn.disabled = true;
    if (conQR) {
      enviar(nombre);
    } else {
      cargando('Registrando…');
      servidor('registrar', [clave(), nombre], inicio);
    }
  }
  btn.onclick = enviarNombre;
  input.onkeydown = function (e) { if (e.key === 'Enter') enviarNombre(); };
}

function iniciales(n) {
  var p = String(n).trim().split(/\s+/);
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return ((p[0] || '').charAt(0) + p[p.length - 1].charAt(0)).toUpperCase();
}

function tarjeta(r) {
  return '<section class="tarjeta">' +
    '<div class="quien"><div class="avatar">' + GORRO + esc(iniciales(r.nombre)) + '</div>' +
    '<div><div class="hola">¡Feliz Navidad,</div><div class="nombre">' + esc(r.nombre) + '!</div></div></div>' +
    '<div class="puntos"><span class="num" id="pn">' + Number(r.total || 0) + '</span>' +
    '<span class="unidad">puntos acumulados</span></div>' +
    (r.id ? '<p class="id-jugador">Tu ID de jugador: <b>' + esc(r.id) + '</b></p>' : '') + '</section>';
}

// Escribe el nombre de la posada en el letrero: primera palabra arriba, el resto abajo
function ponerLetrero(t) {
  var p = String(t || '').trim().toUpperCase().split(/\s+/);
  var arriba = p.shift() || '', abajo = p.join(' ');
  [['ltr1', arriba, 25, 2, 92], ['ltr2', abajo, 22, 1.2, 96]].forEach(function (x) {
    var el = document.getElementById(x[0]), n = x[1].length;
    var fs = x[2], ancho = n * (fs * 0.5 + x[3]);
    if (ancho > x[4]) fs = Math.max(11, fs * x[4] / ancho);
    el.textContent = x[1];
    el.setAttribute('font-size', fs.toFixed(1));
  });
}

// Cambia la escena de arriba:
//  'repetido' → muñeco de nieve | 'ok' → niños saltando con fondo blanco | otro → Santa, pino y reno
function verEscena(cual) {
  var esc = cual === 'repetido' || cual === 'ok' || cual === 'leyendo' ? cual : 'normal';
  ['normal', 'repetido', 'ok', 'leyendo'].forEach(function (n) {
    document.getElementById('escena-' + n).style.display = n === esc ? 'block' : 'none';
  });
}

// Dibuja un niño saltando. x = posición, d = retraso de la animación
function nino(x, piel, pelo, sueter, pantalon, extra, d) {
  var s = 'animation-delay:' + d + 's';
  var h = '<g transform="translate(' + x + ' 216)">' +
    '<ellipse class="nino-sombra" style="' + s + '" cx="0" cy="2" rx="16" ry="4" fill="rgba(30,40,60,.15)"/>' +
    '<g class="nino-salta" style="' + s + '">' +
      '<rect x="-9" y="-30" width="7" height="28" rx="3" fill="' + pantalon + '"/>' +
      '<rect x="2" y="-30" width="7" height="28" rx="3" fill="' + pantalon + '"/>' +
      '<ellipse cx="-6" cy="-2" rx="6.5" ry="3.5" fill="#3a2a1a"/><ellipse cx="6" cy="-2" rx="6.5" ry="3.5" fill="#3a2a1a"/>' +
      '<g class="nino-brazo izq" style="animation-delay:' + (d + 0.1) + 's">' +
        '<path d="M-11 -55 L-25 -84" stroke="' + sueter + '" stroke-width="7" stroke-linecap="round"/>' +
        '<circle cx="-26" cy="-87" r="5" fill="' + piel + '"/></g>' +
      '<g class="nino-brazo der" style="animation-delay:' + d + 's">' +
        '<path d="M11 -55 L25 -84" stroke="' + sueter + '" stroke-width="7" stroke-linecap="round"/>' +
        '<circle cx="26" cy="-87" r="5" fill="' + piel + '"/></g>' +
      '<rect x="-14" y="-62" width="28" height="34" rx="10" fill="' + sueter + '"/>' +
      '<rect x="-14" y="-47" width="28" height="5" fill="#fff" opacity=".85"/>' +
      '<circle cx="-7" cy="-44.5" r="1.4" fill="' + sueter + '"/><circle cx="0" cy="-44.5" r="1.4" fill="' + sueter + '"/>' +
      '<circle cx="7" cy="-44.5" r="1.4" fill="' + sueter + '"/>' +
      '<circle cx="0" cy="-76" r="14" fill="' + piel + '"/>' +
      '<path d="M-14 -78 Q-12 -94 0 -92 Q12 -94 14 -78 Q8 -86 0 -85 Q-8 -86 -14 -78Z" fill="' + pelo + '"/>' +
      '<path d="M-8 -78 q3 -4 6 0 M2 -78 q3 -4 6 0" stroke="#2a1d1f" stroke-width="1.8" fill="none" stroke-linecap="round"/>' +
      '<path d="M-5.5 -71 Q0 -63 5.5 -71 Z" fill="#8a2433"/>' +
      '<circle cx="-9" cy="-72" r="2.6" fill="#f4a3a0" opacity=".8"/><circle cx="9" cy="-72" r="2.6" fill="#f4a3a0" opacity=".8"/>';
  if (extra === 'gorro') {
    h += '<path d="M-14 -84 Q-4 -112 18 -100 L12 -86Z" fill="#c8102e"/>' +
         '<rect x="-16" y="-89" width="32" height="7" rx="3.5" fill="#fff"/><circle cx="19" cy="-100" r="4.5" fill="#fff"/>';
  } else if (extra === 'cuernos') {
    h += '<path d="M-8 -88 L-12 -102 M-11 -97 L-17 -100 M8 -88 L12 -102 M11 -97 L17 -100" stroke="#a8733f" stroke-width="2.6" stroke-linecap="round" fill="none"/>' +
         '<path d="M-13 -86 Q0 -96 13 -86" stroke="#c8102e" stroke-width="2.5" fill="none"/>';
  } else if (extra === 'colitas') {
    h += '<circle cx="-15" cy="-82" r="5.5" fill="' + pelo + '"/><circle cx="15" cy="-82" r="5.5" fill="' + pelo + '"/>' +
         '<circle cx="-11" cy="-85" r="2.4" fill="#2f9e62"/><circle cx="11" cy="-85" r="2.4" fill="#2f9e62"/>';
  } else if (extra === 'gorra') {
    h += '<path d="M-14 -82 Q0 -104 14 -82Z" fill="#1f7a4d"/>' +
         '<rect x="-15" y="-85" width="30" height="6" rx="3" fill="#f2c14e"/><circle cx="0" cy="-99" r="4.5" fill="#f2c14e"/>';
  }
  return h + '</g></g>';
}

function dibujarNinos() {
  document.getElementById('ninos').innerHTML =
    nino(54, '#f6c9a8', '#6b3e26', '#c8102e', '#2b3a67', 'gorro', 0) +
    nino(118, '#c98d63', '#2a1d1f', '#2f9e62', '#4a3b2a', 'colitas', 0.25) +
    nino(242, '#e8b48f', '#d9a441', '#f2b33d', '#2b3a67', 'cuernos', 0.12) +
    nino(306, '#8d5a3b', '#1d1d1d', '#1f7a4d', '#7a1d2b', 'gorra', 0.38);
}

function inicio(r, aviso, animar) {
  verEscena('normal');
  if (!r || !r.nombre) {
    resultado({ tipo: 'hola', titulo: '¡Bienvenido a la posada!',
      sub: 'Escanea el código QR que te dieron para entrar al juego y sumar tus primeros puntos.' });
    return;
  }
  poner((aviso ? '<p class="aviso ' + (r.tipo || '') + '">' + esc(aviso) + '</p>' : '') +
    tarjeta(r) + '<p class="nota">' + D.mensajeFinal + '</p>');
  var t = document.querySelector('.tarjeta');
  if (t && t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'center' });
  if (animar) contador(Number(r.desde || 0), Number(r.total || 0));
}

var TACHE = '<svg viewBox="0 0 40 40" aria-hidden="true"><defs><pattern id="baston" width="7" height="7" ' +
  'patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/>' +
  '<rect width="3.5" height="7" fill="#c8102e"/></pattern></defs>' +
  '<rect x="16.5" y="3" width="7" height="34" rx="3.5" fill="url(#baston)" stroke="#c8102e" stroke-width="1.2" transform="rotate(45 20 20)"/>' +
  '<rect x="16.5" y="3" width="7" height="34" rx="3.5" fill="url(#baston)" stroke="#c8102e" stroke-width="1.2" transform="rotate(-45 20 20)"/>' +
  '<ellipse cx="14.5" cy="15" rx="5" ry="2.6" fill="#1f7a4d" transform="rotate(-30 14.5 15)"/>' +
  '<ellipse cx="25.5" cy="15" rx="5" ry="2.6" fill="#2f9e62" transform="rotate(30 25.5 15)"/>' +
  '<circle cx="18" cy="19" r="2.6" fill="#c8102e"/><circle cx="22" cy="19" r="2.6" fill="#9a0b22"/></svg>';
var ICONOS = { ok: '🎁', repetido: TACHE, expirado: '⏰', agotado: '🦌', invalido: '❓', error: '⚠️', hola: '🎅' };
var AVISOS = { ok: 'Último código', repetido: 'Ese QR ya lo tenías', expirado: 'Ese código ya cerró',
               agotado: 'Ese código ya se agotó', invalido: 'Ese código no es válido para la dinámica' };

// Muestra el resultado del escaneo unos segundos y luego lleva a la pantalla de puntos
function resultado(o) {
  var tipo = o.tipo || 'hola';
  if (tipo === 'repetido') { o.titulo = 'Ya tienes este QR'; o.sub = 'Cada QR suma una sola vez.'; }
  if (tipo === 'ok' && (!o.sub || o.sub === '¡Sigue buscando!')) o.sub = '¡Sigue sumando puntos!';
  verEscena(tipo);
  var h = '<div class="estado grande ' + tipo + '" role="status">' +
    (tipo === 'ok' ? '<span class="timbre" aria-hidden="true">🎄</span>' : '') +
    '<div class="ico">' + (ICONOS[tipo] || '⭐') + '</div>' +
    '<div><div class="t">' + esc(o.titulo || '') + '</div>' +
    (o.sub ? '<div class="s">' + esc(o.sub) + '</div>' : '') + '</div></div>';
  if (o.nombre) h += '<button class="boton" id="ver">⭐ Ver mis puntos</button>';
  else h += '<p class="nota">' + D.mensajeFinal + '</p>';
  poner(h);
  var est = document.querySelector('.estado');
  if (est && est.scrollIntoView) est.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if (tipo === 'ok') confeti();

  if (o.nombre) {
    var listo = false;
    var ir = function () {
      if (listo) return;
      listo = true;
      var aviso = tipo === 'ok' ? AVISOS.ok + ': ' + o.titulo.replace(/[¡!]/g, '') : AVISOS[tipo];
      inicio(o, aviso, tipo === 'ok');
    };
    document.getElementById('ver').onclick = ir;
    setTimeout(ir, 10000);
  }
}

function enviar(nombre, opcion) {
  revisando(nombre ? 'Santa está anotando tu apodo en su lista' : 'Santa está revisando el QR');
  servidor('escanear', [D.codigo, clave(), nombre || '', opcion || ''], function (o) {
    o = o || {};
    if (o.nuevaClave) guardarClave(o.nuevaClave);   // este celular adopta la cuenta recuperada
    if (o.pedirNombre) bienvenida(true);
    else if (o.confirmar) confirmarCuenta(nombre, o.candidatos || []);
    else resultado(o);
  });
}

// Ese apodo ya existe: preguntar si es de esta persona
function confirmarCuenta(apodo, candidatos) {
  verEscena('normal');
  var c = candidatos[0] || {};
  poner('<section class="tarjeta">' +
    '<h2>Ese apodo ya está registrado</h2>' +
    '<p>¿<b>' + esc(c.nombre || apodo) + '</b> es tu apodo? Si es tuyo, tus puntos se recuperan en este celular.</p>' +
    '<button class="boton" id="mio">✅ Sí, es mío · ' + Number(c.total || 0) + ' pts</button>' +
    '<button class="boton secundario" id="otro">No, elegiré otro apodo</button></section>');
  document.getElementById('mio').onclick = function () { enviar(apodo, 'vincular:' + c.id); };
  document.getElementById('otro').onclick = function () {
    bienvenida(true, 'El apodo "' + apodo + '" ya está ocupado. Elige otro.');
  };
}

/* ---------- Celebración ---------- */
function confeti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (var i = 0; i < 90; i++) {
    (function (i) {
      setTimeout(function () {
        var d = document.createElement('div');
        d.className = 'conf';
        d.style.left = Math.random() * 100 + 'vw';
        var CF = ['#c8102e', '#f2c14e', '#2f9e62', '#ff4d4d', '#1f7a4d', '#b8c2cc'];
        d.style.background = CF[Math.floor(Math.random() * CF.length)];
        var s = 6 + Math.random() * 8;
        d.style.width = s + 'px'; d.style.height = (s * 1.6) + 'px';
        if (Math.random() < .3) d.style.borderRadius = '50%';
        var t = 2.5 + Math.random() * 2.5;
        d.style.animationDuration = t + 's';
        document.body.appendChild(d);
        setTimeout(function () { d.remove(); }, t * 1000 + 100);
      }, i * 40);
    })(i);
  }
}

function contador(a, b) {
  var el = document.getElementById('pn');
  if (!el) return;
  var t0 = null;
  function f(ts) {
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0) / 1400, 1);
    el.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(f);
  }
  el.textContent = a;
  setTimeout(function () { requestAnimationFrame(f); }, 450);
}

/* ---------- Arranque ---------- */
try { var ev = localStorage.getItem('posada_evento'); if (ev) ponerEvento(ev); } catch (e) {}
esferas();
dibujarNinos();
if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) nieve();

if (D.codigo) {
  enviar('');
} else {
  cargando();
  servidor('estado', [clave()], inicio);
}
</script>
